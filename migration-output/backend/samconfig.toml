version = 0.1

[dev.build.parameters]
cached = true
parallel = true

[dev.deploy.parameters]
stack_name = "dev-movilidad-api"
region = "us-east-1"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
s3_prefix = "dev-movilidad-api"
parameter_overrides = [
  "Environment=dev",
  "VpcSubnetIds=/dev/movilidad/network/subnets",
  "LambdaSecurityGroupId=/dev/movilidad/network/lambda-sg",
  "DbProxyEndpoint=/dev/movilidad/db/proxy-endpoint",
  "DbSecretName=/dev/movilidad/db/app",
  "DbName=olo_dev_movilidad_db",
  "AllowedOrigins=/dev/movilidad/frontend/origin",
  "SesFromEmail=/dev/movilidad/notifications/from-email",
]
tags = [
  "Project=MOVILIDAD",
  "Environment=DEV",
  "Name=dev-movilidad-api",
]

