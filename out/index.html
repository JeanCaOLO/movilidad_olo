<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movilidad de Colaboradores · OLO</title>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1A1A1A; --ink-2:#3A3D40; --muted:#6E7479; --line:#E4E6E8; --line-2:#CFD2D5;
    --bg:#EEF0F1; --surface:#FFFFFF;
    --teal:#00B497; --teal-deep:#009C82; --teal-d:#00735E;
    --ok:#00735E; --okbg:#E2F4EF; --danger:#A33A30; --dangerbg:#FBEAE8;
    --warn:#8A6D3B; --warnbg:#F4EFE4;
    --radius:12px; --radius-s:8px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--bg);
    -webkit-font-smoothing:antialiased;line-height:1.5;font-size:15px}
  .num{font-family:'Space Grotesk','Inter',sans-serif;font-variant-numeric:tabular-nums}
  button{font-family:inherit;cursor:pointer}
  a{color:inherit}

  header.app{position:sticky;top:0;z-index:40;background:#fff;color:var(--ink);border-bottom:3px solid var(--teal)}
  .app-inner{max-width:1180px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:13px}
  .logo .mark{display:flex;align-items:center}
  .logo .mark img{height:40px;width:auto;display:block}
  .logo .divider{width:1px;height:32px;background:var(--line)}
  .logo .txt small{display:block;font-weight:400;font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;margin-bottom:1px}
  .logo .txt b{font-size:16px;font-weight:700;letter-spacing:.2px;color:var(--ink)}
  .tabs{margin-left:auto;display:flex;gap:4px;background:#F0F2F3;padding:4px;border-radius:10px;flex-wrap:wrap}
  .tab{border:0;background:transparent;color:var(--muted);padding:8px 16px;border-radius:7px;font-weight:600;font-size:14px;transition:.15s}
  .tab.active{background:var(--teal);color:#fff}
  .tab:hover:not(.active){color:var(--ink)}

  main{max-width:1180px;margin:0 auto;padding:26px 24px 80px}
  .view{display:none}
  .view.active{display:block}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
  .card.pad{padding:22px 24px}
  .card+.card{margin-top:20px}
  .grid{display:grid;grid-template-columns:1fr 332px;gap:24px;align-items:start}
  @media(max-width:920px){.grid{grid-template-columns:1fr}}

  .section-label{font-family:'Space Grotesk';font-weight:600;font-size:17px;margin:0 0 4px;letter-spacing:.2px}
  .section-note{font-size:13px;color:var(--muted);margin:0 0 16px}
  .dash-head{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
  .dash-head h2{font-family:'Space Grotesk';font-size:24px;margin:0;font-weight:700}

  label.fld{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
  .req{color:var(--danger);font-weight:700;margin-left:3px}
  .field-err{border-color:var(--danger) !important;box-shadow:0 0 0 3px rgba(163,58,48,.12) !important}
  /* vista administrador: texto justificado a la izquierda para mejor lectura */
  .av-admin, .av-admin p, .av-admin td, .av-admin th, .av-admin li,
  .av-admin .section-note, .av-admin .section-label, .av-admin .erp-step,
  .av-admin .fld, .av-admin h2, .av-admin h3, .av-admin .bulk-status{ text-align:left; }
  .lockbar{background:#FBF3E7;border:1px solid #E7D3AE;color:#7A5A1E;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:16px}
  .coach-card{border-left:4px solid var(--teal)}
  .coach-list{list-style:none;margin:0;padding:0 20px 18px}
  .coach-list li{position:relative;padding:10px 0 10px 20px;font-size:13.5px;line-height:1.6;color:var(--ink-2);border-top:1px solid #F0F2F3}
  .coach-list li:first-child{border-top:0}
  .coach-list li::before{content:'';position:absolute;left:2px;top:16px;width:7px;height:7px;border-radius:50%;background:var(--teal)}
  .coach-list li b{color:var(--ink)}
  input[type=text],input[type=number],input[type=date],select,textarea{width:100%;border:1px solid var(--line-2);border-radius:var(--radius-s);
    padding:10px 12px;font-family:inherit;font-size:15px;color:var(--ink);background:#fff;transition:.15s}
  input:focus,select:focus,textarea:focus{outline:0;border-color:var(--teal-deep);box-shadow:0 0 0 3px rgba(0,180,151,.18)}
  input[readonly]{background:#F0F2F3;color:var(--ink-2);border-style:dashed}
  textarea{resize:vertical;min-height:74px;line-height:1.5}
  .info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  .info-grid.three{grid-template-columns:repeat(3,1fr)}
  @media(max-width:640px){.info-grid,.info-grid.three{grid-template-columns:1fr}}
  .fldwrap{margin-bottom:16px}

  .btn{border:0;border-radius:9px;padding:12px 20px;font-weight:600;font-size:15px;transition:.15s}
  .btn-primary{background:var(--teal);color:#fff}
  .btn-primary:hover{background:var(--teal-deep)}
  .btn-danger{background:var(--danger);color:#fff}
  .btn-danger:hover{opacity:.9}
  .btn.sm{padding:8px 14px;font-size:13px;border-radius:8px}
  .btn-mini-primary{background:var(--teal);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:600;font-size:14px;display:inline-block}
  .btn-mini-primary:hover{background:var(--teal-deep)}
  .mini{border:1px solid var(--line-2);background:#fff;border-radius:7px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink-2)}
  .mini:hover{background:#F4F6F8}
  .row-act{border:0;background:transparent;color:var(--muted);padding:5px 8px;border-radius:6px;font-size:13px;font-weight:600}
  .row-act:hover{color:var(--teal)}
  .row-act.del:hover{color:var(--danger)}

  .mov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px}
  .mov{border:1px solid var(--line);border-radius:11px;padding:14px 15px 13px;cursor:pointer;background:#fff;transition:.14s;border-left:4px solid var(--mc,#ccc)}
  .mov:hover{border-color:var(--line-2);box-shadow:0 3px 12px rgba(16,40,40,.07)}
  .mov.sel{box-shadow:0 0 0 2px var(--mc) inset;border-left-color:var(--mc)}
  .mov .mno{font-family:'Space Grotesk';font-weight:700;font-size:22px;color:var(--mc);line-height:1}
  .mov .mnm{font-family:'Space Grotesk';font-weight:600;font-size:15px;margin:3px 0 7px}
  .mov .mdesc{font-size:12px;color:var(--muted);line-height:1.45}
  .mov .macc{margin-top:8px;font-size:11.5px;color:var(--ink-2)}
  .mov .macc b{color:var(--mc)}

  .badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 11px;border-radius:20px;white-space:nowrap}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.03em}
  .pill.pendiente{background:var(--warnbg);color:var(--warn)}
  .pill.aprobado{background:var(--okbg);color:var(--ok)}
  .pill.rechazado{background:var(--dangerbg);color:var(--danger)}
  .pill.sinasignar{background:#F0F2F3;color:var(--muted)}

  table{width:100%;border-collapse:collapse;background:#fff}
  .table-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .table-card .th-row{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
  .table-card h3{font-family:'Space Grotesk';font-size:16px;margin:0;font-weight:600}
  .table-card .actions{margin-left:auto;display:flex;gap:8px}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:11px 16px;border-bottom:1px solid var(--line);font-weight:600;background:#FAFBFC}
  td{padding:11px 16px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
  tr:last-child td{border-bottom:0}
  tbody tr:hover td{background:#FAFBFC}
  .code{font-family:'Space Grotesk';font-size:13px;color:var(--ink-2)}

  .avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#EEF0F1;display:grid;place-items:center;
    font-family:'Space Grotesk';font-weight:700;color:var(--muted);font-size:15px;overflow:hidden;border:2px solid var(--line)}
  .avatar.t{border-color:var(--teal)}
  .avatar.sm{width:40px;height:40px;font-size:14px}
  .avatar.lg{width:64px;height:64px;font-size:20px}
  .avatar.xl{width:92px;height:92px;font-size:30px}
  .personcell{display:flex;align-items:center;gap:11px}
  .personcell .who b{display:block;font-size:14px}
  .personcell .who span{font-size:12px;color:var(--muted)}

  .empty{padding:48px 20px;text-align:center;color:var(--muted)}
  .empty .big{font-family:'Space Grotesk';font-size:18px;color:var(--ink-2);font-weight:600;margin-bottom:6px}

  .metrics{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;margin-bottom:22px}
  @media(max-width:900px){.metrics{grid-template-columns:repeat(4,1fr)}}
  @media(max-width:520px){.metrics{grid-template-columns:repeat(2,1fr)}}
  .metric{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:15px 14px;border-top:3px solid var(--mc,var(--teal))}
  .metric .v{font-family:'Space Grotesk';font-weight:700;font-size:30px;line-height:1;color:var(--mc,var(--ink))}
  .metric .l{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.25}

  .people-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:14px}
  .person{display:flex;flex-direction:column;align-items:center;text-align:center;border:1px solid var(--line);
    border-radius:var(--radius);padding:16px 12px;background:#fff;cursor:pointer;transition:.14s}
  .person:hover{border-color:var(--teal);box-shadow:0 4px 14px rgba(0,180,151,.12);transform:translateY(-2px)}
  .person .pname{font-weight:600;font-size:14px;margin-top:10px;line-height:1.25}
  .person .pmeta{font-size:11.5px;color:var(--muted);margin-top:2px}
  .person .badge{margin-top:9px}
  .person .pperiodo{font-family:'Space Grotesk';font-size:11px;color:var(--muted);margin-top:5px}

  .photo-slot{flex:none;width:84px;height:84px;border-radius:12px;border:2px dashed var(--line-2);
    display:grid;place-items:center;cursor:pointer;overflow:hidden;background:#FAFBFC;color:var(--muted);font-size:12px;font-weight:600;transition:.14s;text-align:center;padding:6px}
  .photo-slot:hover{border-color:var(--teal);color:var(--teal)}
  .photo-slot img{width:100%;height:100%;object-fit:cover}

  .summary-num{font-family:'Space Grotesk';font-weight:700;font-size:30px;line-height:1}
  .summary-lbl{font-size:12px;color:var(--muted)}

  .person.sel{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal) inset}

  /* ---- Ficha del colaborador (colores corporativos) ---- */
  .ficha-head{background:linear-gradient(135deg,#0E3A33 0%,#00735E 55%,#00B497 100%);color:#fff;padding:22px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .ficha-head .avatar{border:3px solid rgba(255,255,255,.75);background:rgba(255,255,255,.18);color:#fff}
  .ficha-id{flex:1;min-width:180px}
  .ficha-id h3{margin:0;font-family:'Space Grotesk';font-size:23px;line-height:1.1;color:#fff}
  .ficha-id .sub{font-size:13px;color:#fff;opacity:.92;margin-top:4px}
  .ficha-id .meta{font-size:12px;color:#fff;opacity:.78;margin-top:3px}
  .ficha-hero{text-align:center;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.28);border-radius:14px;padding:10px 16px;min-width:96px}
  .ficha-hero .num{font-family:'Space Grotesk';font-weight:700;font-size:32px;line-height:1;color:#fff}
  .ficha-hero .tier{font-size:11px;font-weight:600;margin-top:3px;color:#fff;opacity:.95}
  .ficha-body{padding:22px 24px}
  .ficha-data{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid #E6EEEC;border-radius:12px;overflow:hidden;margin-bottom:20px}
  @media(max-width:560px){.ficha-data{grid-template-columns:1fr}}
  .ficha-data .drow{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;font-size:13px;border-bottom:1px solid #EEF3F2}
  .ficha-data .drow:nth-child(odd){border-right:1px solid #EEF3F2}
  .ficha-data .drow .k{color:var(--muted);font-weight:600}
  .ficha-data .drow .v{color:var(--ink);font-weight:600;text-align:right}

  .mov-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  @media(max-width:560px){.mov-strip{grid-template-columns:repeat(2,1fr)}}
  .mov-chip{border:1px solid var(--line);border-left:4px solid var(--mc);border-radius:10px;padding:11px 12px}
  .mov-chip .mc-per{font-family:'Space Grotesk';font-size:11px;color:var(--muted);font-weight:600}
  .mov-chip .mc-no{font-family:'Space Grotesk';font-weight:700;font-size:22px;color:var(--mc);line-height:1;margin:2px 0}
  .mov-chip .mc-nm{font-size:12px;font-weight:600;color:var(--ink-2);line-height:1.25}

  /* ---- toolbar profesional ---- */
  .toolbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
  .tb-title{font-family:'Space Grotesk';font-size:23px;margin:0;font-weight:700}
  .tb-sub{font-size:13px;color:var(--muted);margin:4px 0 0}
  .tb-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .btn-back{border:1px solid var(--line-2);background:#fff;color:var(--ink-2);border-radius:8px;padding:9px 15px;font-weight:600;font-size:13px}
  .btn-back:hover{background:#F4F6F8;border-color:var(--teal)}

  /* ---- tarjetas de roster (lista coordinador) ---- */
  .roster-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
  .rcard{display:flex;align-items:flex-start;gap:14px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;transition:.14s;font-family:inherit}
  .rcard:hover{border-color:var(--teal);box-shadow:0 5px 16px rgba(0,180,151,.12);transform:translateY(-1px)}
  .rcard .avatar{flex:none}
  .rcard .rc-info{flex:1;min-width:0}
  .rcard .rc-name{font-weight:600;font-size:14.5px;color:var(--ink);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rcard .rc-meta{font-size:12px;color:var(--muted);margin-top:2px}
  .rcard .rc-badges{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:9px}
  .rcard .rc-lbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
  .rcard .rc-lbl:not(:first-child){margin-left:4px}

  /* ---- selector de movilidad claro ---- */
  .mov-summary{border:1.5px dashed var(--line-2);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:14px;margin-bottom:14px;min-height:64px}
  .mov-summary.has{border-style:solid;border-color:var(--mc);border-left-width:5px}
  .mov-summary .ms-no{font-family:'Space Grotesk';font-weight:700;font-size:30px;color:var(--mc);line-height:1}
  .mov-summary .ms-txt{flex:1}
  .mov-summary .ms-nm{font-family:'Space Grotesk';font-weight:700;font-size:17px;color:var(--ink)}
  .mov-summary .ms-acc{font-size:12.5px;color:var(--ink-2);margin-top:2px}
  .mov-summary .ms-tag{background:var(--mc);color:#fff;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:5px 11px;border-radius:20px}
  .mov-summary .ms-empty{color:var(--muted);font-size:14px}
  .mov-list{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  @media(max-width:620px){.mov-list{grid-template-columns:1fr}}
  .mopt{display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 13px;cursor:pointer;font-family:inherit;transition:.13s;border-left:4px solid transparent}
  .mopt:hover{border-color:var(--line-2);background:#FAFBFC}
  .mopt .mopt-no{font-family:'Space Grotesk';font-weight:700;font-size:17px;color:var(--mc);width:26px;flex:none}
  .mopt .mopt-body{flex:1;min-width:0}
  .mopt .mopt-nm{display:block;font-weight:600;font-size:14px;color:var(--ink)}
  .mopt .mopt-acc{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
  .mopt .mopt-check{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-2);color:transparent;display:grid;place-items:center;font-size:13px;font-weight:700}
  .mopt.sel{border-color:var(--mc);border-left-color:var(--mc);background:color-mix(in srgb,var(--mc) 9%,#fff);box-shadow:0 0 0 1px var(--mc) inset}
  .mopt.sel .mopt-check{background:var(--mc);border-color:var(--mc);color:#fff}
  .mopt.sel .mopt-nm{color:var(--mc)}

  /* ---- dashboard 9-box ---- */
  .ninebox{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
  @media(max-width:860px){.ninebox{grid-template-columns:1fr}}
  .nb-col-h{font-family:'Space Grotesk';font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#fff;padding:9px 12px;border-radius:9px 9px 0 0;text-align:center}
  .nb-col-h.nb-salida{background:#A33A30}
  .nb-col-h.nb-estable{background:#2FA98E}
  .nb-col-h.nb-alto{background:#00735E}
  .nb-cells{display:flex;flex-direction:column;gap:10px;padding:10px;background:#F4F6F7;border:1px solid var(--line);border-top:0;border-radius:0 0 9px 9px}
  .nb-cell{border:1px solid var(--line);border-left:4px solid var(--mc);border-radius:9px;padding:11px 12px;background:#fff}
  .nb-cell-h{display:flex;align-items:center;gap:8px}
  .nb-cell-h .nb-no{font-family:'Space Grotesk';font-weight:700;font-size:15px;color:var(--mc)}
  .nb-cell-h .nb-nm{font-weight:600;font-size:13.5px;flex:1}
  .nb-cell-h .nb-ct{font-family:'Space Grotesk';font-weight:700;font-size:18px;color:var(--mc)}
  .nb-people{display:flex;flex-wrap:wrap;gap:4px;margin:9px 0 6px;min-height:26px;align-items:center}
  .nb-face{border:0;background:transparent;padding:0;cursor:pointer;border-radius:50%;transition:.12s}
  .nb-face:hover{transform:scale(1.12)}
  .nb-face .avatar{width:34px;height:34px;font-size:12px;border-width:2px}
  .nb-more{font-size:11px;font-weight:700;color:var(--muted);align-self:center}
  .nb-empty{font-size:12px;color:var(--muted)}
  .nb-acc{font-size:11px;color:var(--muted)}

  /* ---- matriz departamento × tipo ---- */
  table.matrix{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
  table.matrix th{text-align:center;font-size:11px;color:var(--muted);padding:10px 8px;border-bottom:1px solid var(--line);background:#FAFBFC;font-weight:700}
  table.matrix th:first-child{text-align:left}
  table.matrix td{text-align:center;padding:8px;border-bottom:1px solid var(--line)}
  table.matrix .mx-dep{text-align:left;font-weight:600}
  table.matrix .mx-area{text-align:left;color:var(--ink-2);font-size:12.5px}
  table.matrix .mx-cell{font-family:'Space Grotesk';font-weight:700}
  table.matrix .mx-tot{font-family:'Space Grotesk';font-weight:700;color:var(--teal-deep)}
  table.matrix .mx-foot td{font-family:'Space Grotesk';font-weight:700;background:#FAFBFC;border-top:2px solid var(--line)}
  table.matrix .mx-foot td:first-child{text-align:left;color:var(--muted);font-family:'Inter'}

  /* current vs previous in comité ficha */
  .fx-mov{display:flex;align-items:stretch;gap:12px;margin-top:4px}
  .fx-mov-box{flex:1;border:1px solid var(--line);border-radius:11px;padding:12px 14px;background:#fff}
  .fx-mov-k{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:7px}
  .fx-mov-v{margin-bottom:4px}
  .fx-mov-acc{font-size:12px;color:var(--ink-2)}
  .fx-mov-arrow{align-self:center;color:var(--muted);font-size:20px;font-weight:700}
  @media(max-width:520px){.fx-mov{flex-direction:column}.fx-mov-arrow{transform:rotate(90deg)}}
  .fx-comite{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .fx-comite .btn{margin-left:auto}
  .comite-seal{display:inline-flex;align-items:center;gap:8px;background:var(--okbg);color:var(--ok);border:1px solid #BFE6DD;border-radius:9px;padding:9px 14px;font-weight:700;font-size:13px}

  /* sello aprobado en las caras del 9-box */
  .nb-face{position:relative}
  .nb-face.closed:after{content:"✓";position:absolute;right:-2px;bottom:-2px;width:14px;height:14px;background:var(--ok);color:#fff;border:2px solid #fff;border-radius:50%;font-size:8px;font-weight:700;display:grid;place-items:center}

  /* barras apiladas comparativas (departamento / área) */
  .stk-legend{display:flex;flex-wrap:wrap;gap:12px;padding:14px 20px 4px}
  .stk-legend span{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
  .stk-legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
  .stk-wrap{padding:12px 20px 18px}
  .stk-group{margin-bottom:16px}
  .stk-gh{font-family:'Space Grotesk';font-weight:700;font-size:13px;color:var(--teal-deep);margin:0 0 8px;display:flex;align-items:baseline;gap:8px}
  .stk-gh span{font-size:11.5px;color:var(--muted);font-weight:400}
  .stk-row{display:flex;align-items:center;gap:12px;margin-bottom:9px}
  .stk-lbl{width:150px;flex:none;font-size:13px;color:var(--ink-2);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stk-track{flex:1;min-width:0;display:flex;height:26px;border-radius:7px;overflow:hidden;background:#EEF2F1}
  .stk-seg{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11.5px;font-weight:700;min-width:0}
  .stk-n{width:30px;flex:none;text-align:right;font-family:'Space Grotesk';font-weight:700;font-size:13px;color:var(--ink)}
  @media(max-width:600px){.stk-lbl{width:96px}}

  /* repositorio */
  .repo-folder{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
  .rf-head{display:flex;align-items:center;gap:12px;padding:14px 18px 6px}
  .rf-ico{font-size:18px}
  .rf-per{font-family:'Space Grotesk';font-weight:700;font-size:16px}
  .rf-count{font-size:12.5px;color:var(--muted)}
  .rf-acts{display:flex;gap:8px;flex-wrap:wrap;padding:0 18px 12px;border-bottom:1px solid var(--line)}
  .rf-acts button{padding:8px 12px;font-size:12.5px}
  .rf-body{padding:6px 0}
  .rf-file{display:flex;align-items:center;gap:12px;padding:9px 18px;border-bottom:1px solid #F0F2F3}
  .rf-file:last-child{border-bottom:0}
  .rf-file-info{flex:1;min-width:0}
  .rf-file-name{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rf-file-meta{font-size:11.5px;color:var(--muted)}
  .rf-file .mini{padding:6px 11px;font-size:12px}
  /* overlay de carga */
  #busyOv{position:fixed;inset:0;background:rgba(26,26,26,.28);backdrop-filter:blur(1px);z-index:9999;display:none;align-items:center;justify-content:center}
  #busyOv.show{display:flex}
  #busyOv .busy-box{background:#fff;border-radius:14px;padding:22px 28px;display:flex;flex-direction:column;align-items:center;gap:12px;box-shadow:0 12px 40px rgba(0,0,0,.2)}
  #busyOv .busy-spin{width:34px;height:34px;border:3px solid #E4E6E8;border-top-color:var(--teal);border-radius:50%;animation:busyspin .8s linear infinite}
  #busyOv span{font-size:13px;font-weight:600;color:var(--ink-2)}
  @keyframes busyspin{to{transform:rotate(360deg)}}
  /* indicador de estado del jefe (pre-comité) */
  .rdy{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:20px;white-space:nowrap}
  .rdy i{width:7px;height:7px;border-radius:50%;display:inline-block}
  .rdy-lista{background:#E7F5F1;color:#00735E}.rdy-lista i{background:#00B497}
  .rdy-aprobado{background:#E7F5F1;color:#00735E}.rdy-aprobado i{background:#00735E}
  .rdy-proceso{background:#FBF1E4;color:#9A6B12}.rdy-proceso i{background:#E0A43B}
  .rdy-rechazado{background:#F7E7E4;color:#A33A30}.rdy-rechazado i{background:#A33A30}
  .rdy-sin{background:#EEF0F1;color:#6B7278}.rdy-sin i{background:#AEB4B9}
  .danger-zone{border:1px solid #E4B4AE;background:#FCF6F5}
  /* guía de carga ERP */
  .erp-guide{background:#F4F8F7;border:1px solid #DCEAE7;border-radius:10px;padding:12px 14px;margin:4px 0 4px}
  .erp-step{display:flex;align-items:flex-start;gap:9px;font-size:13px;color:var(--ink-2);margin:7px 0;line-height:1.5}
  .erp-step>div{flex:1;text-align:left}
  .erp-cols{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px 28px}
  .erp-n{flex:none;width:19px;height:19px;border-radius:50%;background:var(--teal);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;margin-top:1px}
  /* avance por área */
  .prog-track-all{height:10px;border-radius:6px;background:#EEF2F1;overflow:hidden}
  .prog-fill-all{height:100%;background:var(--teal);border-radius:6px}
  .prog-row{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .prog-lbl{width:190px;flex:none;font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .prog-track{flex:1;min-width:0;height:16px;border-radius:6px;background:#EEF2F1;position:relative;overflow:hidden}
  .prog-fill{position:absolute;left:0;top:0;height:100%;background:var(--teal);opacity:.5}
  .prog-fill-ap{position:absolute;left:0;top:0;height:100%;background:var(--ok)}
  .prog-n{width:56px;flex:none;text-align:right;font-family:'Space Grotesk';font-weight:700;font-size:13px}
  .prog-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}
  .prog-legend span{display:inline-flex;align-items:center;gap:6px}
  .prog-legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
  @media(max-width:600px){.prog-lbl{width:110px}}

  code{background:#F0F2F3;padding:2px 6px;border-radius:5px;font-size:12.5px;color:var(--ink-2)}

  .modal-overlay{position:fixed;inset:0;background:rgba(20,26,30,.55);display:none;align-items:flex-start;justify-content:center;z-index:90;padding:34px 16px;overflow:auto}
  .modal-overlay.show{display:flex}
  .modal{background:#fff;border-radius:16px;max-width:600px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
  .fx-head{position:relative;background:linear-gradient(135deg,#0E3A33 0%,#00735E 55%,#00B497 100%);color:#fff;padding:24px 26px}
  .fx-head .fclose{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.2);border:0;color:#fff;width:34px;height:34px;border-radius:9px;font-size:18px;cursor:pointer}
  .fx-head .fclose:hover{background:rgba(255,255,255,.32)}
  .fx-top{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .fx-head .avatar{border:3px solid rgba(255,255,255,.75);background:rgba(255,255,255,.18);color:#fff}
  .fx-id h3{margin:0;font-family:'Space Grotesk';font-size:24px;line-height:1.1;color:#fff}
  .fx-id .sub{font-size:13px;color:#fff;opacity:.9;margin-top:4px}
  .fx-hero{margin-left:auto;text-align:center;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.28);border-radius:14px;padding:11px 16px;min-width:120px}
  .fx-hero .num{font-family:'Space Grotesk';font-weight:700;font-size:34px;line-height:1;color:#fff}
  .fx-hero .tier{font-size:11.5px;font-weight:600;margin-top:3px;color:#fff;opacity:.95}
  .fx-body{padding:22px 26px}
  .sec{font-family:'Space Grotesk';font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--teal-deep);margin:0 0 12px;display:flex;align-items:center;gap:8px}
  .sec:before{content:"";width:14px;height:2px;background:var(--teal);border-radius:2px}
  .timeline{border-left:2px solid var(--line);margin-left:6px;padding-left:16px}
  .timeline .item{margin-bottom:15px;position:relative}
  .timeline .item:before{content:'';position:absolute;left:-21px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--teal)}
  .timeline .item .p{font-family:'Space Grotesk';font-size:11px;color:var(--muted);margin-bottom:3px}
  .timeline .item .cmt{font-size:12.5px;color:var(--ink-2);margin-top:4px}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:10px;font-size:14px;font-weight:500;z-index:120;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  .muted{color:var(--muted)}
  .bulk-status{font-size:12px;color:var(--muted);margin-top:8px}
  .scope-banner{display:none;align-items:center;gap:14px;background:var(--teal-deep);color:#fff;padding:10px 24px;font-size:14px}
  .scope-banner button{margin-left:auto;background:#fff;color:var(--teal-deep);border:0;border-radius:7px;padding:7px 14px;font-weight:600;font-size:13px;cursor:pointer}
  .clink{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
  .clink .cn{font-weight:600;font-size:13.5px}
  .clink .cc{font-size:11.5px;color:var(--muted);margin-bottom:6px}
  .clink input{font-size:11.5px;padding:6px 8px;margin-bottom:6px}
  .clink .lbtns{display:flex;gap:6px;flex-wrap:wrap}
  .clink .lbtns button{padding:6px 10px;font-size:12px}
  #emailBody{width:100%;height:250px;font-family:inherit;font-size:13px}
  /* envíos de correo compactos */
  .mail-block{border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .mail-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid #F0F2F3}
  .mail-row:last-child{border-bottom:0}
  .mail-row>div:first-child{flex:1;min-width:180px;font-size:13.5px}
  .mail-acts{display:flex;gap:8px;flex-wrap:wrap}
  .mail-acts button{padding:8px 12px;font-size:12.5px}
  .mail-indiv{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .mail-indiv select{flex:1;min-width:220px}
  .mail-indiv button{white-space:nowrap}
  .mail-row-focus{background:#EAF7F3;box-shadow:inset 3px 0 0 var(--teal)}
  /* candado de acceso */
  .lockwrap{display:flex;justify-content:center;padding:60px 16px}
  .lockcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:36px 32px;max-width:420px;width:100%;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.06)}
  .lock-ico{font-size:34px;margin-bottom:8px}
  .lockcard h3{font-family:'Space Grotesk';font-size:20px;margin:0 0 8px}
  .lockcard p{font-size:13.5px;color:var(--muted);margin:0 0 16px;line-height:1.5}
  .lockcard input{width:100%;text-align:center;font-size:18px;letter-spacing:3px;padding:12px}
  .lock-hint{font-size:12px !important;color:var(--muted);margin-top:14px !important;border-top:1px solid var(--line);padding-top:12px}
</style>
</head>

function saveBlob(blob, name){
  let url;

  const inIframe = (function(){ try{ return window.self!==window.top; }catch(e){ return true; } })();
  try{
    if(inIframe){
      const win=window.open(url,'_blank');
      if(!win){ const a=document.createElement('a'); a.href=url; a.download=name; a.target='_blank'; document.body.appendChild(a); a.click(); a.remove(); }
    } else {
      const a=document.createElement('a'); a.href=url; a.download=name; a.rel='noopener'; document.body.appendChild(a); a.click(); a.remove();
    }
    setTimeout(()=>{ try{ URL.revokeObjectURL(url); }catch(e){} }, 60000);
    return true;
  }catch(e){ toast('La descarga fue bloqueada por el entorno. Abre el archivo en el navegador.'); return false; }
}

function periodoOptions(){
  // desde el semestre actual (según la fecha) hacia los próximos 20 años
  const cur=parsePeriodo(currentPeriodo()); const out=[];
  let y=cur.y, s=cur.h;
  for(let i=0;i<40;i++){ out.push(y+'-S'+s); if(s===1){ s=2; } else { s=1; y++; } }

  return out;   // orden cronológico: el actual primero

function parsePeriodo(p){
  const s=String(p==null?'':p).toLowerCase();
  let m=s.match(/(\d{4})\D*s?\s*([12])(?!\d)/); if(m) return {y:+m[1], h:+m[2]};   // 2026-s2 / 2026 s2
  m=s.match(/([12])\s*s\D*(\d{4})/); if(m) return {y:+m[2], h:+m[1]};              // 2s-2026
  m=s.match(/s\s*([12])\D*(\d{4})/); if(m) return {y:+m[2], h:+m[1]};              // s2-2026
  return null;
}
function fmtPeriodo(o){ return o.y+'-S'+o.h; }
function periodPrev(p){ const o=parsePeriodo(p); if(!o) return null; return o.h===2?{y:o.y,h:1}:{y:o.y-1,h:2}; }
function prevPeriods(p,n){ const out=[]; let cur=parsePeriodo(p); if(!cur) return out; for(let i=0;i<n;i++){ cur=periodPrev(fmtPeriodo(cur)); if(!cur) break; out.push(fmtPeriodo(cur)); } return out; }

function tcase(s){ if(s==null||s==='') return s; const low=new Set(['de','del','la','las','los','y','e','da','do','dos','van','von','di','della']);
  return String(s).trim().toLowerCase().split(/\s+/).map((w,i)=>{ if(low.has(w)&&i>0) return w; return w.replace(/^[\wáéíóúñü]/, ch=>ch.toUpperCase()); }).join(' '); }
function normName(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,''); }
function movFromCell(v){
  if(v==null||v==='') return 0;
  const s=String(v).trim();
  let m=s.match(/^m\s*([1-7])$/i); if(m) return +m[1];        // M7, M 3 (código del ERP)
  if(/^[1-7]$/.test(s)) return +s;                            // "3"
  const key=normName(s);
  const mm=MOVILIDAD.find(x=>normName(x.nombre)===key || (key&&key.includes(normName(x.nombre))));
  if(mm) return mm.id;
  const any=s.match(/(?:^|[^0-9])([1-7])(?![0-9])/); if(any) return +any[1];   // "Mov 5", "M7"
  return 0;
}

/* ============ fechas Excel ============ */
function normDate(s){
  if(!s) return ''; s=String(s).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  const m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(m){ let[_,d,mo,y]=m; if(y.length===2)y='20'+y; return `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`; }
  return s;
}
function toDateStr(v){
  if(v==null||v==='') return '';
  if(v instanceof Date && !isNaN(v.getTime())) return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0');
  if(typeof v==='number' && isFinite(v)){ const d=new Date(Math.round((v-25569)*86400000)); if(!isNaN(d.getTime())) return d.toISOString().slice(0,10); }
  return normDate(String(v));
}

function compressFile(file){
  return new Promise(res=>{
    const fr=new FileReader();
    fr.onload=()=>{ const raw=fr.result; const img=new Image();
      img.onload=()=>{ try{ const max=560; let{width:w,height:h}=img; const sc=Math.min(1,max/Math.max(w,h)); w=Math.round(w*sc)||img.width; h=Math.round(h*sc)||img.height;
        const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); const out=c.toDataURL('image/jpeg',0.72); res(out&&out.length>40?out:raw); }catch(e){ res(raw); } };
      img.onerror=()=>res(raw); img.src=raw; };
    fr.onerror=()=>res(''); fr.readAsDataURL(file);
  });
}

// Muestra SIEMPRE un nombre. Si el valor guardado es un correo, intenta resolver el nombre

function dispName(v){
  const s=String(v==null?'':v).trim();
  if(!s) return '—';
  if(s.includes('@')){
    const hit=Object.entries(DIR.correos).find(([k,mail])=>String(mail).toLowerCase()===s.toLowerCase());
    if(hit){ const j=DIR.jefes[hit[0]]; if(j&&j.nombre) return tcase(j.nombre); }
    const local=s.split('@')[0].replace(/[._\-]+/g,' ').trim();
    return local?tcase(local):s;
  }
  return tcase(s);
}

function evalOf(colabId, periodo){ return Object.values(DB.evaluaciones).find(e=>e.colaboradorId===colabId && e.periodo===periodo); }

function latestClasificacion(colabId){
  const items=[];
  Object.values(DB.evaluaciones).forEach(e=>{ if(e.colaboradorId===colabId && e.estado==='aprobado') items.push({periodo:e.periodo, tipo:e.tipoMovilidad, fecha:e.fechaAprobacion||e.fechaRegistro}); });
  Object.values(DB.historico).forEach(h=>{ if(h.colaboradorId===colabId) items.push({periodo:h.periodo, tipo:h.tipoMovilidad, fecha:h.fecha||h.fechaCarga}); });
  if(!items.length) return null;
  items.sort((a,b)=> (a.periodo>b.periodo?1:a.periodo<b.periodo?-1: new Date(a.fecha)-new Date(b.fecha)));
  return items[items.length-1];
}
function timelineFor(colabId){
  const items=[];
  Object.values(DB.evaluaciones).forEach(e=>{ if(e.colaboradorId===colabId) items.push({periodo:e.periodo, tipo:e.tipoMovilidad, fecha:e.fechaAprobacion||e.fechaRegistro, origen:'Evaluación', estado:e.estado, cmt:e.justificacion}); });
  Object.values(DB.historico).forEach(h=>{ if(h.colaboradorId===colabId) items.push({periodo:h.periodo, tipo:h.tipoMovilidad, fecha:h.fecha||h.fechaCarga, origen:'Carga histórica', estado:'aprobado', cmt:h.comentario}); });
  items.sort((a,b)=> b.periodo.localeCompare(a.periodo) || new Date(b.fecha)-new Date(a.fecha));
  return items;
}
/* movilidad previa: el registro más reciente ANTERIOR al periodo dado */
function prevMov(colabId, period){
  const items=timelineFor(colabId).filter(it=>it.estado!=='rechazado' && (!period || it.periodo<period));
  return items.length? items[0] : null;
}
/* la evaluación más reciente del colaborador (por periodo) */
function latestEval(colabId){
  return Object.values(DB.evaluaciones).filter(e=>e.colaboradorId===colabId)
    .sort((a,b)=> b.periodo.localeCompare(a.periodo) || new Date(b.fechaRegistro)-new Date(a.fechaRegistro))[0] || null;
}

function antiguedad(ingreso){
  if(!ingreso) return '—';
  const d=new Date(ingreso); if(isNaN(d)) return '—';
  const now=new Date(); let mo=(now.getFullYear()-d.getFullYear())*12+(now.getMonth()-d.getMonth());
  if(now.getDate()<d.getDate()) mo--; if(mo<0) return '—';
  const y=Math.floor(mo/12), mm=mo%12;
  const py = y? (y+(y===1?' año':' años')) : '';
  const pm = mm? (mm+(mm===1?' mes':' meses')) : '';
  return (py&&pm)? py+' '+pm : (py||pm||'menos de 1 mes');
}
function antigOf(c){ const a=c&&c.antiguedad!=null?String(c.antiguedad).trim():''; return a || antiguedad(c&&c.ingreso); }

  const cls = colabs.map(c=>({c, cl:comiteClasifFor(c.id, comitePeriod)}));
  const byType={}; MOVILIDAD.forEach(m=>byType[m.id]=[]);
  let clasificados=0;
  cls.forEach(x=>{ if(x.cl){ byType[x.cl.tipo].push(x.c); clasificados++; } });
  // matriz (Departamento + Área) × tipo
  const groups={}; // key -> {depto, area, counts}
  colabs.forEach(c=>{ const dep=c.depto||'(Sin depto)', ar=c.area||'—'; const k=dep+'||'+ar; if(!groups[k]) groups[k]={depto:dep, area:ar, counts:Object.fromEntries(MOVILIDAD.map(m=>[m.id,0]))}; });

  const rows=Object.values(groups).sort((a,b)=> a.depto.localeCompare(b.depto) || a.area.localeCompare(b.area));
  const maxCell=Math.max(1,...rows.flatMap(g=>MOVILIDAD.map(m=>g.counts[m.id])));

  return `<section class="view active">

function coachRecommendations(byType, rows, total){
  const head=`<div class="th-row"><h3>Recomendaciones para el comité</h3></div>`;
  if(!total){
    return `<div class="table-card coach-card" style="margin-top:22px">${head}
      <p class="section-note" style="padding:0 20px 18px;margin:0">Aún no hay colaboradores clasificados en este periodo. En cuanto el gerente de área apruebe casos en el pre-comité (o al consultar un semestre histórico), aquí aparecerá una lectura de la distribución con recomendaciones para la conversación del comité.</p>
    </div>`;
  }
  const fam=k=>MOV_FAMILIAS.find(f=>f.k===k).ids.reduce((s,id)=>s+byType[id].length,0);
  const salida=fam('salida'), estable=fam('estable'), alto=fam('alto'), m7=byType[7].length;
  const pct=n=> total? Math.round(n/total*100):0;
  const areaAgg=rows.map(g=>{ const t=MOVILIDAD.reduce((s,m)=>s+g.counts[m.id],0);
    return {label:g.depto+' · '+g.area, t, s:g.counts[1]+g.counts[2], a:g.counts[5]+g.counts[6], e:g.counts[3]+g.counts[4]+g.counts[7]}; }).filter(x=>x.t>0);
  const riesgo=areaAgg.filter(x=>x.s>0).sort((x,y)=>(y.s/y.t)-(x.s/x.t))[0];
  const talento=areaAgg.filter(x=>x.a>0).sort((x,y)=>(y.a/y.t)-(x.a/x.t))[0];
  const sesgo=areaAgg.filter(x=>x.t>=4 && (Math.max(x.s,x.e,x.a)/x.t)>=0.8)[0];
  const it=[];
  it.push(`<b>Panorama general.</b> De ${total} colaborador(es) clasificado(s): <b>${pct(alto)}%</b> en alto desempeño, <b>${pct(estable)}%</b> estables/clave y <b>${pct(salida)}%</b> en salida y ajuste. Una organización saludable concentra a la mayoría en el bloque estable/clave, sostiene un grupo visible de alto desempeño y mantiene el bloque de salida y ajuste acotado y siempre con un plan asociado.`);
  if(alto) it.push(`<b>Talento a capitalizar.</b> El alto desempeño es su activo más escaso: asegúrenle retención, planes de sucesión, asignaciones reto y espacios para que actúe como mentor. Cuídenlo de dos riesgos silenciosos: el estancamiento y la sobrecarga por ser “los de siempre”.`);
  if(estable) it.push(`<b>Columna vertebral.</b> El grupo estable/clave sostiene la operación. Manténganlo conectado con desarrollo puntual y reconocimiento; es de aquí de donde suele emerger el próximo alto desempeño cuando se le da el reto adecuado.`);
  if(salida) it.push(`<b>Foco de atención.</b> El bloque de salida y ajuste pide conversaciones honestas y planes de mejora con plazos y apoyos claros. Antes de concluir una salida, revisen el <i>ajuste al puesto</i> y la calidad del acompañamiento del líder: muchas veces el problema es de encaje o de dirección, no de la persona.`);
  if(m7) it.push(`<b>En adaptación (M7).</b> ${m7} persona(s) llevan menos de un año en el puesto. Evalúenlas con prudencia y prioricen acompañamiento; aún es pronto para conclusiones definitivas.`);
  if(riesgo && (riesgo.s/riesgo.t)>=0.34) it.push(`<b>Concentración de riesgo.</b> “${esc(riesgo.label)}” reúne la mayor proporción de salida/ajuste (${riesgo.s} de ${riesgo.t}). Cuando el patrón se agrupa en un área, conviene mirar causas de <i>sistema</i> —liderazgo, carga de trabajo, selección, claridad de expectativas— antes de mirar a las personas una por una.`);
  if(talento && (talento.a/talento.t)>=0.34) it.push(`<b>Cantera de talento.</b> “${esc(talento.label)}” es donde más se concentra el alto desempeño; puede ser fuente de sucesores y de buenas prácticas para replicar en otras áreas.`);
  if(sesgo) it.push(`<b>Posible sesgo de calificación.</b> En “${esc(sesgo.label)}” casi todos quedaron en la misma categoría. Vale la pena contrastar con el líder si refleja la realidad o un sesgo de indulgencia/severidad, para sostener la consistencia entre áreas.`);
  it.push(`<b>Para cerrar.</b> Sugiero decidir por bloques (talento, estable, ajuste), documentar el acuerdo y la <i>actividad de desarrollo</i> de cada caso, y dar seguimiento el próximo semestre para observar el movimiento real entre categorías. La foto de hoy vale por las decisiones que activemos, no por la clasificación en sí.`);
  return `<div class="table-card coach-card" style="margin-top:22px">
    ${head}
    <p class="section-note" style="padding:0 20px;margin:0 0 8px">Comité, con base en la distribución observada, les comparto una lectura y algunas sugerencias para orientar la conversación:</p>
    <ul class="coach-list">${it.map(i=>`<li>${i}</li>`).join('')}</ul>
  </div>`;
}

async function downloadRepoExcel(periodo){

  await ensureXLSX();
  const name=`movilidad_ERP_${periodo}_OLO.xlsx`;
  if(window.XLSX){
    try{ const ws=XLSX.utils.aoa_to_sheet(aoa); ws['!cols']=[{wch:12},{wch:30},{wch:12}];
      const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Movilidad');

      saveBlob(new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), name);
      toast('Excel del semestre '+periodo+' generado ✓'); return;
    }catch(e){ /* cae al respaldo */ }

  const rowsXml=aoa.map(r=>'<Row>'+r.map(c=>`<Cell><Data ss:Type="String">${esc(String(c==null?'':c))}</Data></Cell>`).join('')+'</Row>').join('');

  saveBlob(new Blob([xml],{type:'application/vnd.ms-excel'}), `movilidad_ERP_${periodo}_OLO.xls`);

  });

/* clasificación para el comité: prioriza la vigente (aprobada/histórico); si no hay, muestra la más reciente propuesta (pendiente) para que el comité la revise con foto */
function comiteClasif(colabId){
  const cl=latestClasificacion(colabId); if(cl) return cl;
  const ev=Object.values(DB.evaluaciones).filter(e=>e.colaboradorId===colabId)
    .sort((a,b)=> b.periodo.localeCompare(a.periodo) || new Date(b.fechaRegistro)-new Date(a.fechaRegistro))[0];
  return ev? {periodo:ev.periodo, tipo:ev.tipoMovilidad, fecha:ev.fechaRegistro, propuesta:true} : null;
}
/* clasificación de un colaborador PARA un periodo concreto.
   - periodo actual (el que se evalúa): solo si pasó la aprobación del gerente (pre-comité) o ya lo cerró el comité.
   - periodos pasados: se toma del histórico o de la evaluación aprobada/cerrada de ese periodo. */
function comiteClasifFor(colabId, period){
  const activo = comiteActivePeriod();
  if(period===activo){
    const ev=evalOf(colabId, period);
    if(ev && (ev.comiteAprobado || ev.estado==='aprobado')) return {periodo:period, tipo:ev.tipoMovilidad, cerrada:!!ev.comiteAprobado};
    return null;
  }
  const ev=Object.values(DB.evaluaciones).find(e=>e.colaboradorId===colabId && e.periodo===period && (e.comiteAprobado||e.estado==='aprobado'));
  if(ev) return {periodo:period, tipo:ev.tipoMovilidad, cerrada:!!ev.comiteAprobado};
  const hi=Object.values(DB.historico).find(x=>x.colaboradorId===colabId && x.periodo===period);
  if(hi) return {periodo:period, tipo:hi.tipoMovilidad, historico:true};
  return null;
}
/* el periodo que se está evaluando (el más reciente con evaluaciones pendientes/aprobadas, o el vigente) */
function comiteActivePeriod(){
  const withEval=[...new Set(Object.values(DB.evaluaciones).map(e=>e.periodo))].sort();
  return withEval.length? withEval[withEval.length-1] : currentPeriodo();
}
/* todos los periodos con datos (evaluaciones + histórico), desc, incluyendo el activo */
function comitePeriodsAvail(){
  const s=new Set(); Object.values(DB.evaluaciones).forEach(e=>s.add(e.periodo)); Object.values(DB.historico).forEach(h=>s.add(h.periodo)); s.add(comiteActivePeriod());
  return [...s].filter(Boolean).sort().reverse();
}
/* ¿la evaluación del supervisor para el periodo activo está lista? (tiene justificación) */
function supervisorReady(colabId){
  const ev=evalOf(colabId, comiteActivePeriod());
  if(!ev) return {estado:'sin', txt:'Sin iniciar'};
  if(ev.estado==='aprobado'||ev.comiteAprobado) return {estado:'aprobado', txt:'Aprobada'};
  if(ev.estado==='rechazado') return {estado:'rechazado', txt:'Rechazada'};
  if(ev.justificacion && ev.justificacion.trim()) return {estado:'lista', txt:'Lista para revisar'};
  return {estado:'proceso', txt:'Falta el jefe inmediato'};
}

async function decidirPre(colabId, estado){

  gName = gName ? dispName(gName) : '';   // nombre en formato Nombre Apellido (mayúscula inicial)
  if(!gName) return toast('Indica el gerente que decide.');
  const cmt=(document.getElementById('gComent')&&document.getElementById('gComent').value.trim())||'';
  if(estado==='rechazado' && !cmt) return toast('Al rechazar, agrega un comentario.');

async function readSheet(file){
  const name=(file.name||'').toLowerCase();
  const isExcel = name.endsWith('.xlsx')||name.endsWith('.xls')||(file.type&&file.type.includes('sheet'))||(file.type&&file.type.includes('ms-excel'));
  if(isExcel){
    await ensureXLSX();
    if(!window.XLSX){ toast('No se pudo cargar el lector de Excel. Revisa tu conexión.'); return null; }
    const buf=await file.arrayBuffer(); const wb=XLSX.read(buf,{type:'array',cellDates:true});
    const ws=wb.Sheets[wb.SheetNames[0]];
    return XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
  }
  const text=await file.text();
  return Papa_like(text);
}
/* CSV parser mínimo (sin dependencia) */
function Papa_like(text){
  const rows=[]; let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else{ if(ch==='"') q=true; else if(ch===','){ row.push(cur);cur=''; }
      else if(ch==='\n'){ row.push(cur); rows.push(row); row=[];cur=''; }
      else if(ch==='\r'){} else cur+=ch; } }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
function headerIndex(headerRow){
  const h=headerRow.map(c=>String(c==null?'':c).trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''));
  return {
    nombre:h.findIndex(x=>x.includes('nombre')||x.includes('colaborador')),
    ficha:h.findIndex(x=>x.includes('codigo')||x.includes('ficha')||x.includes('cedula')||x==='id'),
    cargo:h.findIndex(x=>x.includes('puesto')||x.includes('cargo')),
    nivel:h.findIndex(x=>x.includes('nivel')),
    paso:h.findIndex(x=>x.includes('paso')),
    depto:h.findIndex(x=>x.includes('departamento')||x.startsWith('depto')),
    area:h.findIndex(x=>x==='area'||x.startsWith('area')),
    seccion:h.findIndex(x=>x.includes('seccion')),
    profesion:h.findIndex(x=>x.includes('profesion')),
    coord:h.findIndex(x=>x.includes('jefe')||x.includes('coord')),
    correojefe:h.findIndex(x=>(x.includes('correo')||x.includes('mail'))&&(x.includes('jefe')||x.includes('supervisor')||x.includes('inmediato'))),
    gerente:h.findIndex(x=>x.includes('gerente')&&!x.includes('correo')&&!x.includes('mail')),
    correoger:h.findIndex(x=>(x.includes('correo')||x.includes('mail'))&&x.includes('gerente')),
    ingreso:h.findIndex(x=>x.includes('ingreso')||x.includes('contrata')||x.includes('alta')),
    antig:h.findIndex(x=>x.includes('antigued')||x.includes('antiguedad')),
    movilidad:h.findIndex(x=>x.includes('movil')),
    periodo:h.findIndex(x=>x.includes('periodo')||x.includes('semestre')),
    justif:h.findIndex(x=>x.includes('justif')||x.includes('coment')),
    fecha:h.findIndex(x=>x.includes('fecha')&&!x.includes('ingreso')&&!x.includes('nacim'))
  };
}
async function onHistFile(file){
  const rows=await readSheet(file); if(!rows||!rows.length){ toast('El archivo está vacío'); return; }
  const map=headerIndex(rows[0]); let start = map.nombre>-1 ? 1 : 0;
  if(map.nombre<0){ Object.assign(map,{nombre:0,ficha:1,cargo:2,nivel:3,periodo:4,movilidad:5,fecha:6,justif:7}); }
  pendingImport=[];
  for(let i=start;i<rows.length;i++){ const r=rows[i]; const g=k=>map[k]>=0?String(r[map[k]]==null?'':r[map[k]]).trim():'';
    const nombre=g('nombre'); if(!nombre) continue;
    pendingImport.push({nombre, ficha:g('ficha'), cargo:g('cargo'), nivel:g('nivel'),
      periodo:g('periodo')||currentPeriodo(), tipo:movFromCell(map.movilidad>=0?r[map.movilidad]:''),
      fecha:toDateStr(map.fecha>=0?r[map.fecha]:''), comentario:g('justif')});
  }
  renderPreview();
}
function renderPreview(){
  const a=document.getElementById('preview'); if(!pendingImport.length){ a.innerHTML=''; return; }
  a.innerHTML = `<div class="section-label" style="font-size:15px;margin:20px 0 8px">Vista previa (${pendingImport.length} filas)</div>
  <div class="table-card"><table><thead><tr><th>Colaborador</th><th>Periodo</th><th>Movilidad</th><th>Fecha</th></tr></thead><tbody>
  ${pendingImport.slice(0,50).map(r=>{ const m=movById(r.tipo); return `<tr><td>${esc(r.nombre)}</td><td class="code">${esc(r.periodo)}</td><td>${m?'M'+m.id+' · '+m.nombre:'<span style="color:var(--danger)">tipo inválido</span>'}</td><td class="code">${esc(r.fecha)||'—'}</td></tr>`; }).join('')}
  </tbody></table></div>
  ${pendingImport.length>50?`<p class="muted" style="font-size:12px;margin-top:8px">…y ${pendingImport.length-50} filas más.</p>`:''}
  <button class="btn btn-primary" id="btnImport" style="margin-top:14px">Confirmar carga de ${pendingImport.length} registros</button>`;
  const bi=document.getElementById('btnImport'); if(bi) bi.onclick=confirmImport;
}
async function confirmImport(){
  let created=0, matched=0;
  for(const r of pendingImport){
    if(!movById(r.tipo)) continue;
    let colab = Object.values(DB.colaboradores).find(c=> (r.ficha && normName(c.ficha)===normName(r.ficha)) || normName(c.nombre)===normName(r.nombre));
    if(!colab){ const id=uid(); colab={id,nombre:r.nombre,ficha:r.ficha,cargo:r.cargo,nivel:r.nivel,depto:'',coord:'',gerente:'',ingreso:'',foto:null,creadoDesde:'carga_historica'}; await Store.set('colaborador:'+id,colab); DB.colaboradores[id]=colab; created++; }
    else matched++;
    const hid=uid(); const h={id:hid, colaboradorId:colab.id, nombreOriginal:r.nombre, periodo:r.periodo||currentPeriodo(), tipoMovilidad:r.tipo, fecha:r.fecha||new Date().toISOString(), fechaCarga:new Date().toISOString(), comentario:r.comentario};
    await Store.set('historico:'+hid,h); DB.historico[hid]=h;
  }
  toast(`Carga completada: ${pendingImport.length} registros (${created} nuevos, ${matched} existentes).`);
  pendingImport=[]; render();
}

/* Detecta las columnas de movilidad. El ERP exporta varias columnas "Movilidad 1S-2026" (repetidas):
   se asignan POSICIONALMENTE de izquierda a derecha = periodo actual, luego los anteriores.
   Si el administrador editó los encabezados con periodos distintos, se respetan esos periodos. */
function movColumns(headerRow){
  const raw=[];
  headerRow.forEach((cell,i)=>{
    const h=String(cell==null?'':cell).trim().toLowerCase();
    const isMov = /movil/.test(h) || /^mov\b/.test(h) || /^mov[_\s-]/.test(h) || /^prev\s*\d/.test(h);
    if(!isMov) return;
    raw.push({colIdx:i, per: parsePeriodo(h)?fmtPeriodo(parsePeriodo(h)):null});
  });
  if(!raw.length) return [];
  const explicitDistinct = raw.every(c=>c.per) && new Set(raw.map(c=>c.per)).size===raw.length;
  const N=raw.length;
  const prevs = prevPeriods(adminPeriod, Math.max(N,3));   // [P-1, P-2, P-3, ...] (más reciente primero)
  // Todas las columnas del archivo son semestres PREVIOS (histórico). El semestre a evaluar
  // NO viene en el archivo: lo evalúa el jefe. Posicional: izq→der = más antiguo→más reciente,
  // por lo que la ÚLTIMA columna es el semestre inmediatamente anterior (P-1).
  return raw.map((c,idx)=>{
    const period = explicitDistinct ? c.per : (prevs[N-1-idx] || prevs[0]);
    return {colIdx:c.colIdx, period, prev:true};
  });
}
async function setHistoricoAdmin(colabId, periodo, tipo){
  // reemplaza cualquier histórico previo de carga_admin para el mismo colaborador+periodo
  const dup=Object.values(DB.historico).find(h=>h.colaboradorId===colabId && h.periodo===periodo && h.origen==='carga_admin');
  const id = dup? dup.id : uid();
  const h={id, colaboradorId:colabId, periodo, tipoMovilidad:tipo, fecha:new Date().toISOString(), fechaCarga:new Date().toISOString(), comentario:'', origen:'carga_admin'};
  await Store.set('historico:'+id,h); DB.historico[id]=h;
}
async function onRosterFile(file){
  busy('Leyendo archivo…');
  try{
  const rows=await readSheet(file); if(!rows||!rows.length){ toast('El archivo está vacío'); return; }
  const map=headerIndex(rows[0]); let start = map.nombre>-1 ? 1 : 0;
  if(map.nombre<0){ Object.assign(map,{nombre:0,ficha:1,cargo:2,nivel:3,depto:4,coord:5,gerente:6,ingreso:7}); }
  const movCols = movColumns(rows[0]);
  let created=0, movPrev=0, dirTouched=false;
  const writes=[];   // [clave, valor] para guardar en lotes al final (evita cientos de await secuenciales)
  busy('Procesando '+(rows.length-start)+' filas…');
  for(let i=start;i<rows.length;i++){ const r=rows[i]; const g=k=>map[k]>=0?String(r[map[k]]==null?'':r[map[k]]).trim():'';
    const nombre=g('nombre'); if(!nombre) continue;
    const ficha=g('ficha');
    // Un correo en la columna de nombre no debe guardarse como nombre.
    let coordRaw=g('coord'), gerRaw=g('gerente');
    let cj=g('correojefe'), cg=g('correoger');
    if(coordRaw.includes('@')){ if(!cj) cj=coordRaw.trim().toLowerCase(); coordRaw=''; }
    if(gerRaw.includes('@')){ if(!cg) cg=gerRaw.trim().toLowerCase(); gerRaw=''; }
    const nombreTC=tcase(nombre), coordTC=tcase(coordRaw);
    const hasGerCol = map.gerente>=0;
    const gerXlsx = tcase(gerRaw);
    const gerFromDir = DIR.jefes[normName(coordTC)] ? DIR.jefes[normName(coordTC)].gerente : '';
    const gerTC = gerXlsx || (hasGerCol ? '' : gerFromDir) || '';
    if(coordTC && (cj || gerTC)){
      const prev=DIR.jefes[normName(coordTC)]||{};
      DIR.jefes[normName(coordTC)]={nombre:coordTC, correo:cj||prev.correo||'', gerente:gerTC||prev.gerente||'', gerenteCorreo:cg||prev.gerenteCorreo||''};
      if(cj) DIR.correos[normName(coordTC)]=cj;
      if(gerTC && cg) DIR.correos[normName(gerTC)]=cg;
      dirTouched=true;
    }
    let colab=Object.values(DB.colaboradores).find(c=> (ficha && normName(c.ficha)===normName(ficha)) || normName(c.nombre)===normName(nombreTC));
    if(!colab){ const id=uid(); colab={id,nombre:nombreTC,ficha,cargo:tcase(g('cargo')),nivel:g('nivel'),paso:g('paso'),depto:tcase(g('depto')),area:tcase(g('area')),seccion:tcase(g('seccion')),profesion:tcase(g('profesion')),coord:coordTC,gerente:gerTC,ingreso:toDateStr(map.ingreso>=0?r[map.ingreso]:''),antiguedad:g('antig'),foto:null}; DB.colaboradores[id]=colab; created++; }
    else { Object.assign(colab,{nombre:nombreTC,cargo:tcase(g('cargo'))||colab.cargo,nivel:g('nivel')||colab.nivel,paso:g('paso')||colab.paso,depto:tcase(g('depto'))||colab.depto,area:tcase(g('area'))||colab.area,seccion:tcase(g('seccion'))||colab.seccion,profesion:tcase(g('profesion'))||colab.profesion,coord:coordTC||colab.coord,gerente:(hasGerCol?(gerXlsx||colab.gerente):(gerTC||colab.gerente)),ingreso:(map.ingreso>=0?toDateStr(r[map.ingreso]):'')||colab.ingreso,antiguedad:g('antig')||colab.antiguedad}); }
    writes.push(['colaborador:'+colab.id, colab]);
    // Todas las columnas del archivo son semestres previos (histórico).
    // Una celda en 0/vacío = no era colaborador ese semestre → no se crea registro (se verá "—").
    for(const mc of movCols){
      if(mc.period===adminPeriod) continue;   // el semestre en evaluación no viene del archivo
      const tipo=movFromCell(r[mc.colIdx]); if(!tipo) continue;
      const dup=Object.values(DB.historico).find(h=>h.colaboradorId===colab.id && h.periodo===mc.period && h.origen==='carga_admin');
      const id = dup? dup.id : uid();
      const hrec={id, colaboradorId:colab.id, periodo:mc.period, tipoMovilidad:tipo, fecha:new Date().toISOString(), fechaCarga:new Date().toISOString(), comentario:'', origen:'carga_admin'};
      DB.historico[id]=hrec; writes.push(['historico:'+id, hrec]); movPrev++;
    }
  }
  if(dirTouched) writes.push(['directorio', DIR]);
  busy('Guardando '+writes.length+' registros…');
  await mapBatched(writes, ([k,v])=>Store.set(k,v), 25);   // guardado en paralelo por lotes
  const parts=[`${created} colaborador(es)`]; if(movPrev) parts.push(`${movPrev} movilidad(es) previa(s)`); if(dirTouched) parts.push('correos vinculados');
  const p2=document.getElementById('preview2');
  if(p2) p2.innerHTML=`<p class="section-note" style="margin:0 0 10px"><b>Carga completada.</b> ${parts.join(' · ')}. El archivo aporta el <b>histórico</b> (semestres previos); el semestre en evaluación (<b>${adminPeriod}</b>) lo registra cada jefe inmediato. Las celdas vacías o en 0 se muestran como “—”.</p><button class="btn-mini-primary" onclick="openBulkEmail('jefe inmediato')">✉ Enviar la evaluación a todos los jefes inmediatos</button>`;
  toast(`Carga completada: ${parts.join(', ')} ✓`);
  render();
  }catch(err){ console.error('onRosterFile',err); toast('Error al procesar el archivo: '+(err&&err.message||err)); }
  finally{ idle(); }
}
async function bulkPhotoUpload(files){
  if(!files.length) return;
  busy('Procesando fotos…');
  try{
  const st=document.getElementById('bulkStatus'); if(st) st.textContent='Procesando fotos…';
  const list=colabList(); let matched=0, sinMatch=[]; const writes=[];
  let done=0;
  for(const f of files){
    done++; busy('Procesando fotos… '+done+'/'+files.length);
    const base=f.name.replace(/\.[a-z0-9]+$/i,''); const key=normName(base); const numKey=String(parseInt(base,10));
    let colab = list.find(c=>normName(c.ficha)&&normName(c.ficha)===key)
             || list.find(c=>c.ficha&&/^\d+$/.test(String(parseInt(base,10)))&&String(parseInt(c.ficha,10))===numKey)
             || list.find(c=>normName(c.nombre)===key)
             || list.find(c=>normName(c.ficha)&&key.includes(normName(c.ficha)))
             || list.find(c=>key&&normName(c.nombre)&&(key.includes(normName(c.nombre))||normName(c.nombre).includes(key)));
    if(!colab){ sinMatch.push(f.name); continue; }
    const b64=await compressFile(f);
    if(b64){ colab.foto=b64; DB.colaboradores[colab.id]=colab; writes.push(['colaborador:'+colab.id, colab]); matched++; }
  }
  busy('Guardando fotos…');
  await mapBatched(writes, ([k,v])=>Store.set(k,v), 15);
  if(st) st.textContent=`${matched} foto(s) vinculada(s).`+(sinMatch.length?` Sin coincidencia: ${sinMatch.slice(0,5).join(', ')}${sinMatch.length>5?'…':''}`:'');
  toast(matched+' foto(s) cargada(s) ✓');
  render();
  }catch(err){ console.error('bulkPhotoUpload',err); toast('Error al cargar fotos: '+(err&&err.message||err)); }
  finally{ idle(); }
}
function attachPhoto(id){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';

  inp.click();
}

/* ---- Directorio de correos: jefe inmediato (evalúa) y gerente de área (aprueba) ---- */
async function onDirFile(file){
  const rows=await readSheet(file); if(!rows||!rows.length){ toast('El archivo está vacío'); return; }
  const H=rows[0].map(c=>String(c==null?'':c).trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''));
  const idx=(f)=>H.findIndex(f);
  const jefeName = idx(x=>(x.includes('jefe')||x.includes('supervisor')||x.includes('coord'))&&!x.includes('correo')&&!x.includes('mail'));
  const jefeMail = idx(x=>(x.includes('correo')||x.includes('mail'))&&(x.includes('jefe')||x.includes('supervisor')||x.includes('coord')));
  const gerName  = idx(x=>x.includes('gerente')&&!x.includes('correo')&&!x.includes('mail'));
  const gerMail  = idx(x=>(x.includes('correo')||x.includes('mail'))&&x.includes('gerente'));
  if(jefeName<0){ toast('No se encontró la columna de Jefe Inmediato en el archivo.'); return; }
  const dir={jefes:{}, correos:{}};
  let n=0;
  for(let i=1;i<rows.length;i++){ const r=rows[i];
    const jn=String(r[jefeName]==null?'':r[jefeName]).trim(); if(!jn) continue;
    const jm=jefeMail>=0?String(r[jefeMail]||'').trim():'';
    const gn=gerName>=0?String(r[gerName]||'').trim():'';
    const gm=gerMail>=0?String(r[gerMail]||'').trim():'';
    const jTC=tcase(jn), gTC=tcase(gn);
    dir.jefes[normName(jTC)]={nombre:jTC, correo:jm, gerente:gTC, gerenteCorreo:gm};
    if(jm) dir.correos[normName(jTC)]=jm;
    if(gTC&&gm) dir.correos[normName(gTC)]=gm;
    n++;
  }
  DIR=dir; await Store.set('directorio', dir);
  // aplica gerente de área a los colaboradores según su jefe inmediato
  let patched=0;
  for(const c of Object.values(DB.colaboradores)){ const j=DIR.jefes[normName(c.coord)]; if(j&&j.gerente&&c.gerente!==j.gerente){ c.gerente=j.gerente; await Store.set('colaborador:'+c.id,c); patched++; } }
  toast(`Directorio cargado: ${n} jefe(s)/gerente(s)${patched?`, ${patched} colaborador(es) vinculados`:''} ✓`);
  render();
}

    document.querySelectorAll('.delColab').forEach(b=> b.onclick=async()=>{
      const id=b.dataset.id;
      const ok=await confirmModal(`¿Eliminar a ${b.dataset.name}? Se borrará también su evaluación e histórico. Esta acción no se puede deshacer.`, true);
      if(!ok) return;
      const writes=[['colaborador:'+id]];
      for(const e of Object.values(DB.evaluaciones)){ if(e.colaboradorId===id){ writes.push(['evaluacion:'+e.id]); delete DB.evaluaciones[e.id]; } }
      for(const hh of Object.values(DB.historico)){ if(hh.colaboradorId===id){ writes.push(['historico:'+hh.id]); delete DB.historico[hh.id]; } }
      delete DB.colaboradores[id];
      await mapBatched(writes, ([k])=>Store.del(k), 25);
      toast('Persona eliminada.'); render();
    });
    const rs=document.getElementById('rosterSearch'); if(rs) rs.oninput=()=>{ const q=rs.value.toLowerCase(); document.querySelectorAll('#rosterTable tbody tr').forEach(tr=>{ tr.style.display=tr.dataset.name.includes(q)?'':'none'; }); };
  }
}
document.getElementById('modalOverlay').addEventListener('click',e=>{ if(e.target.id==='modalOverlay') closeModal(); });

/* ============ init ============ */
(async()=>{
  try{
    if(COORD_SCOPE) currentTab='coordinador'; else if(GER_SCOPE) currentTab='gerente';
    applyScopeChrome();
    busy('Conectando con la base de datos…');
    try{ await loadAll(); }catch(e){ console.error('loadAll',e); }
    ready=true;
    idle();
    applyScopeChrome(); render();
  }catch(err){
    console.error('init', err);
    idle();
    const v=document.getElementById('views');
    if(v) v.innerHTML='<div style="padding:50px 20px;text-align:center;font-family:Inter,sans-serif;color:#A33A30"><b>No se pudo iniciar la aplicación.</b><br><span style="color:#6B7278;font-size:13px">'+String(err&&err.message||err)+'</span><br><br><span style="color:#6B7278;font-size:13px">Descarga el archivo y ábrelo directamente en tu navegador.</span></div>';
  }
})();
</script>
